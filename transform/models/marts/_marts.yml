version: 2

models:
  - name: fct_order_items
    description: "GRAIN: one product in one real order. Twins are removed; revenue uses the price paid."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, p_id]
    columns:
      - name: p_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: p_id
      - name: country
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: order_date
      - name: qty
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: line_revenue
        tests: [not_null]

  - name: fct_daily_demand
    description: "GRAIN: one product, one country, one day with at least one unit ordered."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [p_id, country, order_date]
    columns:
      - name: demand_key
        tests: [unique, not_null]
      - name: p_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: p_id
      - name: country
        tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country
      - name: order_date
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: order_date
      - name: units_sold
        tests: [not_null]

  - name: dim_product
    description: "GRAIN: one product."
    columns:
      - name: p_id
        tests: [unique, not_null]
      - name: product_name
        description: NULL for the 6 products sold with no name.
        tests:
          - not_null:
              config:
                severity: warn
      - name: category_name
        tests: [not_null]

  - name: dim_date
    description: "GRAIN: one calendar day."
    columns:
      - name: order_date
        tests: [unique, not_null]

  - name: dim_country
    description: "GRAIN: one country."
    columns:
      - name: country
        tests: [unique, not_null]
      - name: country_code
        tests: [unique, not_null]
